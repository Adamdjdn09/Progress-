  '<button class="row" style="width:100%" onclick="S.tfa=!S.tfa;render()"><span style="text-align:start"><div>🛡️&nbsp; '+x.tfa+'</div><div class="lbl">'+(S.tfa?x.on:x.off)+'</div></span><span>'+(S.lang==='ar'?'‹':'›')+'</span></button>'+
  '<button class="row" style="width:100%" onclick="showNote()"><span>ℹ️&nbsp; '+x.note+'</span><span>'+(S.lang==='ar'?'‹':'›')+'</span></button></div>'+
  '<button class="logout" onclick="S.tab=\'home\';S.sec=null;render()">⇥ '+x.logout+'</button>';
}
function nic(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="'+p+'"/></svg>'}
function renderNav(){
  var x=t(),d=[['home',nic('M4 11l8-7 8 7v9h-5v-6H9v6H4z'),x.home],['cards',nic('M5 6h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM3 10h18'),x.cards],['profile',nic('M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zM4 20c0-3.5 3.6-6 8-6s8 2.5 8 6z'),x.profile]];
  $('nav').innerHTML=d.map(function(i){return '<button class="'+(S.tab===i[0]?'on':'')+'" onclick="S.tab=\''+i[0]+'\';S.sec=null;render()"><span>'+i[1]+'</span>'+i[2]+'</button>'}).join('');
}
function render(){
  applyTheme();
  $('main').innerHTML=S.tab==='home'?(S.sec!==null?section():home()):S.tab==='cards'?cards():profile();
  renderNav();
  if(S.tab==='home'&&S.sec===null)setupCar();
}
function openSec(i){S.sec=i;render()}
function setLang(l){S.lang=l;render()}
function setTheme(m){S.theme=m;render()}
function cycleTheme(){S.theme=S.theme==='dark'?'light':'dark';render()}
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
</script>
